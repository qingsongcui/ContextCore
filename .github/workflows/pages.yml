name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-website
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify senrelay.com website (SEO + GEO)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build deployment distribution for https://senrelay.com/
        env:
          SITE_URL: https://senrelay.com/
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: npm run build
      - name: Verify production SEO metadata, canonical tags, hreflang, JSON-LD, CNAME, sitemap and llms.txt
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: |
          npm run check
          npm run check:brand
          npm run check:interactions
          npm run check:i18n
          npm run check:sphere
          test -f dist/CNAME
          test -f dist/favicon.ico
          test -f dist/404.html
          test -f dist/compare.html
          test -f dist/en/index.html
          test -f dist/en/guide.html
          test -f dist/en/compare.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          if [ -n "${INDEXNOW_KEY:-}" ]; then test -f "dist/${INDEXNOW_KEY}.txt"; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Submit updated URLs to IndexNow
        if: ${{ vars.INDEXNOW_KEY != '' }}
        env:
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
        run: |
          jq -n \
            --arg key "$INDEXNOW_KEY" \
            '{
              host: "senrelay.com",
              key: $key,
              keyLocation: ("https://senrelay.com/" + $key + ".txt"),
              urlList: [
                "https://senrelay.com/",
                "https://senrelay.com/en/",
                "https://senrelay.com/guide.html",
                "https://senrelay.com/en/guide.html",
                "https://senrelay.com/compare.html",
                "https://senrelay.com/en/compare.html",
                "https://senrelay.com/llms.txt",
                "https://senrelay.com/llms-full.txt"
              ]
            }' | curl -fsS -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d @- || echo "::warning::IndexNow submission returned non-2xx; GitHub Pages deployment succeeded."
