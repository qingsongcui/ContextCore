[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcore-backend"
version = "1.0.0b2"
description = "ContextCore FastAPI Backend"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "starlette==1.9.0",
    "uvicorn[standard]==0.38.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "mcp==1.30.0",
    "cryptography==50.0.0",
    "pypdf==6.21.4",
    "python-docx==1.1.2",
    "ruamel.yaml==0.19.1",
    "json-five==1.1.2",
    "regex==2026.9.29",
    "sly==0.5",
    "sse-starlette==3.5.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller==6.20.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
contextcore = "app.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.adapters", "app.integrations", "app.routers", "app.services"]

[tool.setuptools.package-data]
"app.integrations" = ["host_capability_evidence.json", "omp_extension.ts", "opencode_plugin.ts", "skills/claude_code_skill.md", "skills/codex_skill.md", "skills/antigravity_skill.md", "skills/cursor_skill.md", "skills/opencode_command.md", "skills/omp_command.md"]
"app.services" = ["semantic-runtime-wheels.json", "semantic-runtime-requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
